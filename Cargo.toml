[workspace]
resolver = "2"
members = ["muxtls-proto", "muxtls"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["shellrow <shellrow@foctal.com>"]
license = "MIT"
repository = "https://github.com/foctal/muxtls"
homepage = "https://github.com/foctal/muxtls"

[workspace.dependencies]
bytes = "1"
tokio = { version = "1", features = ["rt", "sync", "macros", "net", "io-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
rustls-platform-verifier = "0.6"
rcgen = "0.14"
rustls-pemfile = "2.2"
futures-util = { version = "0.3", features = ["sink"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
thiserror = "2"
muxtls-proto = { path = "muxtls-proto", version = "0.2.0" }
